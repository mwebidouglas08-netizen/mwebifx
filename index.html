<!doctype html>
<html lang="en" dir="auto">
    <head>
        <script>
            (function () {
                var mode = 'dark';
                try { mode = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; } catch (_) {}
                var root = document.documentElement;
                root.dataset.theme = mode;
                root.classList.add(mode);
                root.style.colorScheme = mode;
            })();
        </script>
        <script>
            // Pre-bundle error catcher: catches crashes that happen while the
            // JS bundle is being parsed/evaluated, before main.tsx can register
            // its own handlers. Renders directly into #root (no React needed).
            window.__showFatalError = function (message) {
                var el = document.getElementById('root');
                if (!el || el.childElementCount > 0) return;
                el.innerHTML =
                    '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#050a14;color:#fff;font-family:sans-serif;flex-direction:column;gap:16px;padding:24px;text-align:center">' +
                    '<p style="font-size:18px;font-weight:600">Something went wrong</p>' +
                    '<p style="font-size:14px;color:#aaa;max-width:600px;word-break:break-word">' +
                    String(message).replace(/</g, '&lt;') +
                    '</p>' +
                    '<button onclick="location.reload()" style="padding:8px 24px;border-radius:4px;border:none;background:#ff444f;color:#fff;cursor:pointer;font-size:14px">Refresh</button>' +
                    '</div>';
            };
            window.addEventListener('error', function (e) {
                if (e.error) window.__showFatalError(e.error.message || String(e.error));
                else if (e.message) window.__showFatalError(e.message);
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                var r = e.reason;
                window.__showFatalError(r instanceof Error ? r.message : String(r));
            });
            // If the bundle silently fails (e.g. a deferred script 404s or a
            // module throws before any handler fires), detect the blank state.
            setTimeout(function () {
                var el = document.getElementById('root');
                if (el && el.childElementCount === 0) {
                    window.__showFatalError('Application bundle failed to load or crashed during startup.');
                }
            }, 8000);
        </script>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#050a14" />
        <meta name="title" content="Mwebifx | AI Trading Hub" />
        <meta name="description" content="AI-powered autonomous trading across all live markets. Deploy intelligent bots that analyze, find best markets, and trade autonomously." />
        <meta property="og:title" content="Mwebifx | AI Trading Hub" />
        <meta property="og:description" content="AI-powered autonomous trading across all live markets." />
        <title>Mwebifx | AI Trading Hub</title>
        <style>
            :root {
                font-size: 62.5%;
                background: #050a14;
            }
            html, body, #root {
                width: 100%;
                min-width: 100%;
                min-height: 100%;
                margin: 0;
                background: #050a14;
            }
            body {
                min-height: 100vh;
            }
            #root {
                min-height: 100vh;
            }
        </style>
    </head>
    <body class="body theme theme--dark">
        <div id="modal_root" class="modal-root"></div>
        <div id="popup_root" class="popup-root"></div>
        <div id="root"></div>
    </body>
</html>
